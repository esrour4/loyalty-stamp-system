<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Outer Ring with Subtle Glow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Coffee Cup Body -->
  <g transform="translate(116, 120)">
    <!-- Steam Lines -->
    <path d="M 80,40 Q 95,15 80,0 Q 65,-15 80,-30" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 140,45 Q 155,18 140,0 Q 125,-18 140,-35" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 200,40 Q 215,15 200,0 Q 185,-15 200,-30" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Cup Rim & Body -->
    <path d="M 20,60 L 260,60 L 235,210 C 230,245 200,265 140,265 C 80,265 50,245 45,210 Z" fill="#1e293b" stroke="url(#accentGradient)" stroke-width="10" />

    <!-- Cup Liquid Fill -->
    <ellipse cx="140" cy="72" rx="100" ry="16" fill="#78350f" />
    <ellipse cx="140" cy="72" rx="80" ry="12" fill="#451a03" />

    <!-- Coffee Latte Art Leaf -->
    <path d="M 140,64 C 130,68 132,76 140,82 C 148,76 150,68 140,64 Z" fill="#fef3c7" opacity="0.9" />

    <!-- Cup Handle -->
    <path d="M 245,95 C 290,95 305,120 305,150 C 305,180 285,200 238,205" fill="none" stroke="url(#accentGradient)" stroke-width="12" stroke-linecap="round" />

    <!-- Cup Saucer Base -->
    <path d="M 20,285 C 20,275 80,270 140,270 C 200,270 260,275 260,285 C 260,295 200,305 140,305 C 80,305 20,295 20,285 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.6" />

    <!-- Loyalty Stamp Badge (Star in Gold Circle) -->
    <g transform="translate(140, 175)" filter="url(#glow)">
      <circle cx="0" cy="0" r="38" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="3" />
      <!-- Star Icon -->
      <polygon points="0,-22 6,-7 22,-7 9,4 14,20 0,10 -14,20 -9,4 -22,-7 -6,-7" fill="#ffffff" />
    </g>
  </g>
</svg>
